name: daily-index-push

on:
  schedule:
    # 北京时间 07:55 / 08:00 / 08:05（GitHub 定时有延迟，多点触发+脚本幂等，尽量准点送达）
    - cron: '55 23 * * *'
    - cron: '0 0 * * *'
    - cron: '5 0 * * *'
  workflow_dispatch:   # 支持手动触发（Actions 页点 Run workflow）

permissions:
  contents: write      # 允许把生成的卡片图 commit 回仓库

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安装依赖（Pillow 画卡片 + 中文字体）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji
          pip install --quiet Pillow

      - name: 抓数据并推送微信
        env:
          FMP_KEY: ${{ secrets.FMP_KEY }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python fetch_data.py

      - name: 提交卡片与状态文件到仓库
        run: |
          if [ -n "$(git status --porcelain cards/ state/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cards/ state/
            git commit -m "update daily card/state $(date +%F)"
            git push
          else
            echo "no changes"
          fi
